<header>
  <mat-toolbar class="border-bottom gap-2">
    <button
      mat-icon-button
      type="button"
      class="d-md-none"
      aria-label="Abrir menú"
      [attr.aria-expanded]="menuAbierto()"
      (click)="abrirMenu.emit()"
    >
      <mat-icon>menu</mat-icon>
    </button>
    <a
      routerLink="/productos"
      class="d-flex align-items-center gap-2 text-reset text-decoration-none"
    >
      <mat-icon aria-hidden="true">storefront</mat-icon>
      <span>TW2 Market</span>
    </a>
    <a mat-button routerLink="/productos" class="d-none d-md-inline-flex">Productos</a>
    @if (sesion.usuario()?.isAdmin) {
      <a mat-button routerLink="/productos/nuevo" class="d-none d-md-inline-flex"
        >Cargar producto</a
      >
    }
    <span class="flex-grow-1"></span>
    @if (sesion.usuario(); as usuario) {
      <a
        mat-icon-button
        routerLink="/carrito"
        aria-label="Carrito"
        [matBadge]="carrito.unidades()"
        [matBadgeHidden]="carrito.unidades() === 0"
      >
        <mat-icon>shopping_cart</mat-icon>
      </a>
      <span class="d-none d-md-flex align-items-center gap-1 fs-6 fw-medium">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        {{ usuario.nombre }} {{ usuario.apellido }}
      </span>
      <button mat-stroked-button type="button" class="d-none d-md-inline-flex" (click)="salir()">
        Salir
      </button>
    } @else {
      <a mat-stroked-button routerLink="/ingresar" class="d-none d-md-inline-flex">Ingresar</a>
    }
  </mat-toolbar>
</header>
